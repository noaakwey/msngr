# Fly.io config — replace app name with something unique
app = "msngr-your-name"
primary_region = "ams"

[env]
  PORT = "3000"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

[mounts]
  source      = "msngr_data"
  destination = "/app/data"
